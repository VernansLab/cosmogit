<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmogit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="hud-top-left">
        <div class="repo" id="repo"></div>
        <div class="date" id="date"></div>
        <div class="ticker" id="ticker"></div>
      </div>
      <div class="hud-top-right" id="legend"></div>
      <div class="hud-bottom">
        <button id="play" class="icon" title="Play / pause (space)">❚❚</button>
        <div class="timeline" id="timeline">
          <canvas id="spark"></canvas>
          <div class="progress" id="progress"></div>
          <div class="hover" id="hover"></div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="exts" id="exts"></div>
    </div>
    <div id="drop" class="drop">
      <div class="drop-card">
        <h1>Cosmogit</h1>
        <p>Drop a <code>git log</code> JSON from <code>pnpm extract &lt;repo&gt;</code>, or a Gource custom log, anywhere on this page.</p>
        <p class="hint">Or launch straight from a repo: <code>pnpm cosmogit ~/code/my-repo</code></p>
        <div id="samples" class="samples"></div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
